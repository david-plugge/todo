<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173b35" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/app.svg" />
    <link rel="apple-touch-icon" href="/icons/todo-192.png" />
    <script>
      // Runs before first paint so a stored dark preference never flashes light.
      try {
        const stored = localStorage.getItem('todo-theme-v1');
        const dark =
          stored === 'dark' ||
          ((stored === 'system' || stored === null) &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#161a16';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
